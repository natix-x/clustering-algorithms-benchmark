name: flink-kmeans-001

configs_dir: "$SCRATCH/clustering-runs/configs"
output_dir: "$SCRATCH/clustering-runs/results"
log_dir: "$SCRATCH/clustering-runs/logs"
jar_path: "$SCRATCH/jars/flink-clustering-benchmark.jar"

sbatch_config:
  account: "plgclusteringbigdata-cpu"
  partition: "plgrid"
  walltime: "00:10:00"
  java_module: "java/11.0.2" # same Java as in Spark 3.3 -> consistent comparison
  flink_home: "$SCRATCH/flink-1.17.1"  # self installed Flink 1.17.1 + reporter jar in lib/

# TODO: czy to trzeba będzie definiować tutaj czy zawsze chcemy zbierać te metryki???
evaluation_config:
  metrics: ["silhouette", "clusterSizes", "noiseFraction"]
  sampleSize: 10000
  seed: 42

# Optional per-run Flink configuration, applied to the execution environment. Job-scoped keys
# only (execution.*, pipeline.*, ...) — TaskManager process memory is derived by
# flink_resources_resolver.py and written into the per-run flink-conf.yaml.
# flink_config: {}

experiment_matrix:
  nodes: [2]
  resources:
    - cpus_per_task: 4
      tm_per_node: 1
      mem: "48G"
      # Goes to Flink's own memory model unsplit; it decides task heap vs managed memory.
      # Task heap alone comes out ~1.6x under the paired Spark cell's executor heap, which
      # is expected: Flink's point cache lives in MANAGED memory, Spark's in the same heap.
      # Summed, the two land within ~4% (see flink_resources_resolver.py).
      tm_mem_gb: 41
      # PROCESS total, not heap: Flink takes JVM overhead + metaspace + off-heap out of it
      # before the driver sees any. The JobManager IS the driver under Application Mode, so
      # this has to leave a heap matching the paired Spark cell's driver_mem_gb: 4 — at 5 GB
      # the resolver derives 4224 MB of JM heap. `jm_mem_gb: 1` used to leave 448 MB.
      jm_mem_gb: 5
  algorithms:
    - name: kmeans
      params:
        k: 10
        maxIter: 10
        distance: euclidean
  datasets:
    - type: synthetic
      params:
        numPoints: 100000

repetitions: 1
